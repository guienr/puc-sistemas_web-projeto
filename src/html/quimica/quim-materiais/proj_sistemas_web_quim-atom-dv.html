<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Dúvidas - O Átomo</title>
    <meta name="description" content="Plataforma educacional completa que oferece resumos, textos explicativos, exercícios resolvidos, simulados interativos e suporte para tirar dúvidas. Ideal para estudantes que buscam reforço escolar, preparação para vestibulares, concursos ou simplesmente aprender de forma prática e eficiente">
    </head>

<body>

    <h1>Dúvidas - O Átomo</h1>

    <form id="formDuvida" data-content-id="quim-atom">
        <h3>Envie sua Dúvida:</h3>
        <input type="text" id="nomeAluno" placeholder="Seu Nome" required><br><br>
        <textarea id="textoDuvida" placeholder="Digite sua dúvida aqui..." rows="4" required></textarea><br><br>
        <button type="submit">Enviar Dúvida</button>
    </form>

    <hr>

    <h2>Discussão / Dúvidas dos Alunos</h2>
    <div id="listaDuvidas">
        </div>

    <script src="../../../js/script_duvidas.js"></script> 
</body>
</html>
