<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Dúvidas - Soluções</title>
    <meta name="description" content="Espaço interativo para tirar dúvidas sobre Soluções Químicas. Envie perguntas, participe de discussões e aprimore seu entendimento sobre concentração, tipos de soluções e propriedades químicas. Ideal para estudantes que buscam suporte educacional colaborativo.">
    </head>

<body>

    <h1>Dúvidas - Soluções</h1>

    <form id="formDuvida" data-content-id="quim-solu">
        <h3>Envie sua Dúvida:</h3>
        <input type="text" id="nomeAluno" placeholder="Seu Nome" required><br><br>
        <textarea id="textoDuvida" placeholder="Digite sua dúvida aqui..." rows="4" required></textarea><br><br>
        <button type="submit">Enviar Dúvida</button>
    </form>

    <hr>

    <h2>Discussão / Dúvidas dos Alunos</h2>
    <div id="listaDuvidas">
        </div>

    <script src="../../../js/script_duvidas.js"></script> 
</body>
</html>
