<!DOCTYPE html>
<html lang="pt-br">


<head>
    <meta charset="UTF-8">
    <title>StudyBuddy - Área do Usuário</title>
    <meta name="description" content="Área do StudyBuddy para o usuário logado acessar seus dados como nome, email, matérias preferidas e se redirecionar para os materiais">
    <link rel="stylesheet" href="..\..\src\css\style_usuario.css">
</head>


<body>


  <header>
    <div class="logo">
      <img src="..\..\assets\logo_studybuddy.png" alt="StudyBuddy Logo">
    </div>

    <div class="botoes_superiores">
      <a href="proj_sistemas_web_materias.html">
        <button>Matérias</button>
      </a>

      <a href="proj_sistemas_web_simulados.html">
        <button>Simulados</button>
      </a>
    </div>
  </header>


  <div class="container">
    <h1><u>Área do usuário</u></h1>

    <div class="infos">
      <label for="nome"><strong>Nome:</strong></label>
      <span id="nomeUsuario"></span>
    </div>

    <div class="infos">
      <label for="email"><strong>Email:</strong></label>
      <span id="emailUsuario"></span>
    </div>

    <div class="infos">
      <label for="materiasfavs"><strong>Matérias favoritas:</strong></label>
      <ul id="listaFavoritas"></ul>
    </div>

    <div class="botao_alterar">
      <button onclick="window.location.href='proj_sistemas_web_dados.html'">Alterar dados da conta</button>
    </div>
    <div class="botao_sair">
      <button id="logout">Sair</button>
    </div>

  </div>


</body>

<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

<script src="../js/script_usuario.js"></script>

</html>
