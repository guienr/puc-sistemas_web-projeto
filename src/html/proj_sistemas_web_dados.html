<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <title>StudyBuddy - Alterar Dados</title>
    <meta name="description" content= "Área do StudyBuddy para alterar dados do usuário">
    <link rel="stylesheet" href="..\..\src\css\style_dados.css">
</head>


<body>

  <header>
    <div class="logo">
      <img src="..\..\assets\logo_studybuddy.png" alt="StudyBuddy Logo">
    </div>
  </header>

  <div class="container">

    <h1><u>Alterar Dados do Usuário</u></h1>
    <form id="formAlterar">

      <div class="infos">
        <label>Nome:</label>
        <input type="text" id="nome">
      </div>

      <div class="infos">
        <label>Email:</label>
        <input type="email" id="email">
      </div>

      <div class="infos">
        <label>Senha:</label>
        <input type="password" id="senha">
      </div>

      <button type="submit">Salvar Alterações</button>

      <div class="botao_voltar">
        <a href="proj_sistemas_web_usuario.html">
          <button>Voltar</button>
        </a>
      </div>

    </form>
  </div>


  <p id="mensagem"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

<script src="../js/script_dados.js"></script>

</body>

</html>
