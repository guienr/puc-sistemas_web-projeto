<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <title>StudyBuddy</title>
    <meta name="description" content= "Plataforma educacional completa que oferece resumos, textos explicativos, exercícios resolvidos, simulados interativos e suporte para tirar dúvidas. Ideal para estudantes que buscam reforço escolar, preparação para vestibulares, concursos ou simplesmente aprender de forma prática e eficiente">
    <link rel="stylesheet" href="..\..\src\css\style_dados.css">
</head>


<body>

  <header>
    <div class="logo">
      <img src="..\..\assets\logo_studybuddy.png" alt="StudyBuddy Logo">
    </div>
  </header>

  <div class="container">

    <h1><u>Alterar Dados do Usuário</u></h1>
    <form id="formAlterar">

      <div class="infos">
        <label>Nome:</label>
        <input type="text" id="nome" required>
      </div>

      <div class="infos">
        <label>Email:</label>
        <input type="email" id="email" required>
      </div>

      <div class="infos">
        <label>Senha:</label>
        <input type="password" id="senha" required>
      </div>

      <button type="submit">Salvar Alterações</button>

      <div class="botao_voltar">
        <a href="proj_sistemas_web_usuario.html">
          <button>Voltar</button>
        </a>
      </div>

    </form>
  </div>


  <p id="mensagem"></p>

  <script src="..\..\src\js\script_dados.js"></script>

</body>

</html>
