<!DOCTYPE html>
<html lang="pt-br">


<head>
    <meta charset="UTF-8">
    <title>StudyBuddy - Esqueci a Senha</title>
    <meta name="description" content= "Área do StudyBuddy para alterar e recuperar a senha do usuário">
    <link rel="stylesheet" href="..\..\src\css\style_senha.css">
</head>


<body>

    <header>
        <div class="logo">
            <img src="..\..\assets\logo_studybuddy.png" alt="StudyBuddy Logo">
        </div>
    </header>

    <div class="container">
        <h1><u>Esqueci minha senha</u></h1>
        <form id="formulario">
        
        <div class="infos">
            <label for="email">Digite seu e-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com">
        </div>

        <div class="infos">
            <input id="botao" type="submit" value="Recuperar senha">
        </div>

        </form>

        <div class="botao_voltar">
            <a href="proj_sistemas_web_login.html">
                <button>Voltar</button>
            </a>
        </div>
        
    </div>

    <div id="areaRedefinicao" style="display:none;">
    <h2>Redefinir Senha</h2>
    <form id="formularioRedefinir">
        <label for="novaSenha">Nova Senha:</label>
        <input type="password" id="novaSenha" name="novaSenha" placeholder="Mínimo 8 caracteres">

        <label for="confirmaSenha">Confirmar Nova Senha:</label>
        <input type="password" id="confirmaSenha" name="confirmaSenha">

        <input type="submit" value="Salvar Nova Senha">
    </form>
</div>

    <div id="mensagem"></div>

</body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="../js/script_senha.js"></script>

</html>
