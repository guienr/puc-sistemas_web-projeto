<!DOCTYPE html>
<html lang="pt-br">


<head>
    <meta charset="UTF-8">
    <title>StudyBuddy</title>
    <meta name="description" content= "Plataforma educacional completa que oferece resumos, textos explicativos, exercícios resolvidos, simulados interativos e suporte para tirar dúvidas. Ideal para estudantes que buscam reforço escolar, preparação para vestibulares, concursos ou simplesmente aprender de forma prática e eficiente">
    <link rel="stylesheet" href="..\..\src\css\style_senha.css">
</head>


<body>

    <header>
        <div class="logo">
            <img src="..\..\assets\logo_studybuddy.png" alt="StudyBuddy Logo">
        </div>
    </header>

    <div class="container">
        <h1><u>Esqueci minha senha</u></h1>
        <form id="formulario">
        
        <div class="infos">
            <label for="email">Digite seu e-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com">
        </div>

        <div class="infos">
            <input id="botao" type="submit" value="Recuperar senha">
        </div>

        </form>

        <div class="botao_voltar">
            <a href="proj_sistemas_web_login.html">
                <button>Voltar</button>
            </a>
        </div>
        
    </div>

</body>


<div id="mensagem"></div>

<script src="..\..\src\js\script_senha.js"></script>

</html>
