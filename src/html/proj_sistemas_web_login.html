<!DOCTYPE html>
<html lang="pt-br">


<head>
    <meta charset="UTF-8">
    <title>StudyBuddy - Login</title>
    <meta name="description" content= "Área do StudyBuddy para realizar login e ter acesso aos materiais">
    <link rel="stylesheet" href="..\..\src\css\style_login.css">
</head>


<body>

    <header>
        <div class="logo">
            <img src="..\..\assets\logo_studybuddy.png" alt="StudyBuddy Logo">
        </div>
    </header>


    <div class="container">
        <h1><u>Área de login</u></h1>
        <form id="formulario">

            <div class="infos">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com">
            </div> 

            <div class="infos">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" minlength="8" placeholder="Digite sua senha">
            </div>

            <input id="botao" type="submit" value="Logar">

        </form>

        <div class="botao_voltar">
            <a href="index.html">
                <button>Voltar</button>
            </a>
        </div>

        <div class="esqueci">
            <button onclick="window.location.href='proj_sistemas_web_senha.html'">Esqueci a senha</button>
        </div>

    </div>

</body>

<div id="mensagem"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="../js/script_login.js"></script>


</html>
