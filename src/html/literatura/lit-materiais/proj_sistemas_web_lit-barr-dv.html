<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Dúvidas - Barroco</title>
    <meta name="description" content="Envie e visualize dúvidas sobre o Barroco. Espaço interativo para estudantes esclarecerem questões relacionadas ao movimento artístico e literário, com foco em aprendizado colaborativo.">
    <link rel="stylesheet" href="..\..\..\css\literatura\lit-materiais\style_lit-barr-dv.css">
</head>

<body>

    <header>
        <div class="logo">
        <img src="..\..\..\..\assets\logo_studybuddy_lit.png" alt="StudyBuddy Logo Literatura">
        </div>

        <h1 class="titulo">Barroco - Dúvidas</h1>

        <nav class="botao">
        <a href="..\proj_sistemas_web_lit-barr.html">
            <button>Voltar</button> 
        </a>
        </nav>
    </header>

    <div class="containerdv">

      <form id="formDuvida" data-content-id="lit-barr">

        <h2 class="envie">Envie sua Dúvida:</h3>

        <div class="infos">
          <label for="nomeAluno">Nome: </label>
          <input type="text" id="nomeAluno" placeholder="Seu Nome" required><br><br>
        </div>

        <div class="infos">
          <label for="textoDuvida">Dúvida: </label>
          <textarea id="textoDuvida" placeholder="Digite sua dúvida aqui..." rows="4" required></textarea><br><br>
        </div>
          
        <input id="botao" type="submit" value="Enviar dúvida">

      </form>
    </div>

    <hr>

  <div class="containerdv">
    <h2 class="discussao">Discussão - Dúvidas dos Alunos</h2>
    <p class="ordem">(mais recentes primeiro)</p>
    <hr>
    <div id="listaDuvidas"></div>
  </div>

    <script src="../../../js/script_duvidas.js"></script> 
</body>
</html>
